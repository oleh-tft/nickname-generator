<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NickGen | Glassmorphism Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #080b14;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* --- Canvas для салюту --- */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Анімовані сфери на фоні --- */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            top: 10%;
            left: 15%;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            bottom: 10%;
            right: 15%;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #f43f5e, #8b5cf6);
            top: 50%;
            left: 40%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(150px, -90px) scale(1.08); }
            100% { transform: translate(-90px, 120px) scale(0.92); }
        }

        /* --- Glassmorphism картка --- */
        .card-wrapper {
            position: relative;
            z-index: 2;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90vw;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .card-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        /* Поле нікнейму + кнопка копіювання */
        .nickname-container {
            position: relative;
            margin: 1.5rem 0;
        }

        .nickname-box {
            font-size: 1.5rem;
            font-weight: 700;
            padding: 1.2rem 3.2rem 1.2rem 1.2rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #4ade80;
            min-height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .nickname-box.shake {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0.6; }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); opacity: 1; }
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.05);
        }

        .copy-tooltip {
            position: absolute;
            top: -35px;
            right: 5px;
            background: #4ade80;
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            transform: translateY(5px);
        }

        .copy-tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Основна кнопка генерації */
        .btn-generate {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: #ffffff;
            border: none;
            padding: 1rem 1.8rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #0369a1, #4f46e5);
            box-shadow: 0 14px 30px rgba(2, 132, 199, 0.5);
            transform: translateY(-2px);
        }

        .btn-generate:active {
            transform: translateY(1px) scale(0.98);
        }

        .info {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(248, 250, 252, 0.5);
            background: rgba(0, 0, 0, 0.25);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <!-- Canvas для ефекту салюту -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Плаваючі фонові сфери -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Головна картка -->
    <div class="card-wrapper" id="cardWrapper">
        <div class="card" id="card">
            <span class="card-badge">Instant Roll</span>
            <h1>NickGen</h1>

            <div class="nickname-container">
                <div class="nickname-box" id="nickname">---</div>
                <button class="copy-btn" onclick="copyNickname()" title="Скопіювати">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <div class="copy-tooltip" id="copyTooltip">COPIED!</div>
            </div>

            <button class="btn-generate" id="genBtn" onclick="handleGenerate(event)">
                🎲 Згенерувати
            </button>

            <div class="info" id="server-info">SERVER_IP_PLACEHOLDER</div>
        </div>
    </div>

    <script>
        // --- Живий мемно-геймерський словник (без нудного ШІ) ---
        const prefixes = [
            'Giga', 'Turbo', 'Crispy', 'Chill', 'Salty', 'Retro', 'Velvet', 
            'Cosmic', 'Toxic', 'Savage', 'Rusty', 'Fuzzy', 'Pixel', 'Lunar', 
            'Phantom', 'Kinda', 'Mega', 'Snoozy', 'Hyper', 'Neon'
        ];

        const nouns = [
            'Potato', 'Noodle', 'Wanderer', 'Panda', 'Wizard', 'Muffin', 
            'Rider', 'Phoenix', 'Ninja', 'Badger', 'Viper', 'Goblin', 
            'Specter', 'Waffle', 'Nomad', 'Slayer', 'Cactus', 'Otter'
        ];

        function generateNickname() {
            const p = prefixes[Math.floor(Math.random() * prefixes.length)];
            const n = nouns[Math.floor(Math.random() * nouns.length)];
            return `${p}_${n}`;
        }

        // --- Головний хендлер генерації з ефектами ---
        function handleGenerate(e) {
            const nickBox = document.getElementById('nickname');
            
            // Анімація реролу
            nickBox.classList.remove('shake');
            void nickBox.offsetWidth; // Тригер reflow
            nickBox.classList.add('shake');
            
            nickBox.innerText = generateNickname();

            // Запуск салюту
            const btn = document.getElementById('genBtn');
            const rect = btn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnConfetti(x, y);
        }

        // --- Копіювання в буфер ---
        function copyNickname() {
            const nickText = document.getElementById('nickname').innerText;
            if (nickText === '---') return;

            navigator.clipboard.writeText(nickText).then(() => {
                const tooltip = document.getElementById('copyTooltip');
                tooltip.classList.add('show');
                setTimeout(() => tooltip.classList.remove('show'), 1500);
            });
        }

        // --- 3D Нахил Картки при наведенні (Tilt Effect) ---
        const cardWrapper = document.getElementById('cardWrapper');
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- Движок конфеті / салюту на Canvas ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnConfetti(originX, originY) {
            const colors = ['#38bdf8', '#818cf8', '#4ade80', '#f43f5e', '#fbbf24', '#a855f7'];
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: originX,
                    y: originY,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 7 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1,
                    gravity: 0.3
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.opacity -= 0.018;
                p.rotation += p.rSpeed;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0 || p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Початковий нік
        document.getElementById('nickname').innerText = generateNickname();
    </script>
</body>
</html>
