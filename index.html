<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Ніків</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        .nickname-box {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 1rem;
            background-color: #0f172a;
            border-radius: 8px;
            margin: 1.5rem 0;
            color: #4ade80;
            min-height: 2.2rem;
            word-break: break-all;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0284c7; color: white; }
        .info { margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎲 Генератор Ніків</h1>
        <div class="nickname-box" id="nickname">---</div>
        <button onclick="generate()">Згенерувати</button>
        <div class="info" id="server-info">SERVER_IP_PLACEHOLDER</div>
    </div>

    <script>
        const prefixes = ['Shadow', 'Cyber', 'Neon', 'Dark', 'Storm', 'Phantom', 'Ghost', 'Vortex', 'Iron', 'Alpha'];
        const suffixes = ['Slayer', 'Hunter', 'Knight', 'Rider', 'Ninja', 'Wolf', 'Viper', 'Phoenix', 'Blade', 'Master'];

        function generate() {
            const p = prefixes[Math.floor(Math.random() * prefixes.length)];
            const s = suffixes[Math.floor(Math.random() * suffixes.length)];
            const num = Math.floor(Math.random() * 99) + 1;
            document.getElementById('nickname').innerText = `${p}${s}_${num}`;
        }

        generate();
    </script>
</body>
</html>
